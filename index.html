<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>দেনা-পাওনার খাতা</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f7fa;--card:#fff;--tx:#1b2430;--mut:#6b7785;--bd:#d9e0e8;--pri:#1f4e78;--inc:#1a7f4b;--exp:#c0392b;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--card:#1a232d;--tx:#e8edf2;--mut:#93a1b0;--bd:#2b3846;--pri:#5aa2e0;--inc:#4cc28a;--exp:#ef7b6e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161d;--card:#1a232d;--tx:#e8edf2;--mut:#93a1b0;--bd:#2b3846;--pri:#5aa2e0;--inc:#4cc28a;--exp:#ef7b6e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Bengali","Hind Siliguri",Arial,sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px;color:var(--pri)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 120px;min-width:0}
input,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px 10px;width:100%}
button{background:var(--pri);color:#fff;border:0;font-weight:600;cursor:pointer}
button.give{background:var(--exp)}button.get{background:var(--inc)}
button.ghost{background:none;color:var(--pri);border:1px solid var(--bd);width:auto;padding:6px 12px}
button.del{background:none;color:var(--exp);width:auto;padding:2px 8px;font-size:18px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}
.sum b{display:block;font-size:18px}
.lbl{color:var(--mut);font-size:12px}
.inc{color:var(--inc)}.exp{color:var(--exp)}
.item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}
.item.click{cursor:pointer}
.m{flex:1;min-width:0;overflow-wrap:anywhere}
.right{text-align:right}
.empty{color:var(--mut);text-align:center;padding:10px}
.big{font-size:26px;font-weight:700}
textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px 10px;width:100%;min-height:90px;margin-top:6px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
var KEY="khata_v1", people=[], view="home", cur=null, armed=false;
function load(){try{people=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){people=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(people))}catch(e){}}
function bn(n){return "৳"+Math.round(Math.abs(n)).toLocaleString("bn-BD")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function today(){return new Date().toISOString().slice(0,10)}
function bal(p){var b=0;p.entries.forEach(function(e){b+=e.kind==="D"?e.amt:-e.amt});return b}
function status(b){return b>0?'<span class="inc">পাওনা আছে</span>':b<0?'<span class="exp">দেনা আছে</span>':'<span class="lbl">হিসাব সমান</span>'}
function find(id){return people.filter(function(p){return String(p.id)===String(id)})[0]}

function home(){
  var rec=0,ow=0;
  people.forEach(function(p){var b=bal(p);if(b>0)rec+=b;else ow-=b});
  var list=people.slice().sort(function(a,b){return Math.abs(bal(b))-Math.abs(bal(a))});
  return '<h1>দেনা-পাওনার খাতা</h1>'+
  '<div class="card"><div class="sum"><div><span class="lbl">মোট পাওনা</span><b class="inc">'+bn(rec)+'</b></div><div><span class="lbl">মোট দেনা</span><b class="exp">'+bn(ow)+'</b></div></div></div>'+
  '<div class="card"><input id="pn" placeholder="নতুন ব্যক্তির নাম"><input id="pp" type="tel" inputmode="tel" placeholder="ফোন নম্বর (ঐচ্ছিক)" style="margin-top:8px"><div class="lbl" style="margin-top:8px">ছবি (ঐচ্ছিক) <span id="pfm"></span></div><input id="pf" type="file" accept="image/*" style="margin-top:4px"><button id="addP" style="margin-top:10px">ব্যক্তি যোগ করুন</button></div>'+
  '<div class="card">'+(list.length?list.map(function(p){var b=bal(p);
    return '<div class="item click" data-open="'+p.id+'">'+av(p,44)+'<div class="m"><div>'+esc(p.name)+'</div><div class="lbl">'+p.entries.length+'টি লেনদেন'+(p.phone?' · '+esc(p.phone):'')+'</div></div><div class="right"><b class="'+(b>0?'inc':b<0?'exp':'')+'">'+bn(b)+'</b><div class="lbl">'+status(b)+'</div></div></div>'}).join(""):'<div class="empty">এখনো কোনো ব্যক্তি যোগ করা হয়নি</div>')+'</div>'+
  backupCard()+'<p class="lbl" style="text-align:center">তথ্য এই ব্রাউজারেই সংরক্ষিত থাকে।</p>';
}

function person(){
  var p=find(cur); if(!p){view="home";return home()}
  var b=bal(p), asc=p.entries.slice().sort(function(a,b){return a.date===b.date?a.id-b.id:a.date.localeCompare(b.date)});
  var run=0; asc.forEach(function(e){run+=e.kind==="D"?e.amt:-e.amt;e.run=run});
  var rows=asc.slice().reverse();
  return '<div class="row" style="margin-bottom:8px"><button class="ghost" id="back" style="flex:0 0 auto">← ফিরে যান</button></div>'+
  '<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">'+av(p,64)+'<div class="m"><h1 style="margin:0">'+esc(p.name)+'</h1>'+(p.phone?'<a href="tel:'+esc(p.phone)+'" style="color:var(--pri)">'+esc(p.phone)+'</a>':'')+'</div></div>'+
  '<div class="card"><div class="lbl">ব্যক্তির তথ্য</div><input id="ep" type="tel" inputmode="tel" placeholder="ফোন নম্বর" value="'+esc(p.phone||"")+'" style="margin-top:6px"><div class="lbl" style="margin-top:8px">ছবি বদলান</div><input id="epf" type="file" accept="image/*" style="margin-top:4px"></div>'+
  '<div class="card" style="text-align:center"><div class="lbl">বর্তমান হিসাব</div><div class="big '+(b>0?'inc':b<0?'exp':'')+'">'+bn(b)+'</div><div>'+status(b)+'</div></div>'+
  '<div class="card"><div class="row"><input type="date" id="ed" value="'+today()+'"><input id="ea" type="number" inputmode="decimal" min="0" placeholder="পরিমাণ (৳)"></div>'+
  '<input id="en" placeholder="বিবরণ (ঐচ্ছিক)" style="margin-top:8px">'+
  '<div class="row" style="margin-top:10px"><button class="give" data-add="D">প্রদান (যোগ)</button><button class="get" data-add="P">প্রাপ্তি (বিয়োগ)</button></div>'+
  '<div class="lbl" style="margin-top:8px">প্রদান = আপনি টাকা দিয়েছেন, পাওনা বাড়ে। প্রাপ্তি = আপনি টাকা পেয়েছেন, পাওনা কমে।</div></div>'+
  '<div class="card"><div class="lbl">লেনদেনের তালিকা</div>'+(rows.length?rows.map(function(e){
    return '<div class="item"><div class="m"><div>'+esc(e.note||(e.kind==="D"?"প্রদান":"প্রাপ্তি"))+'</div><div class="lbl">'+e.date+' · হিসাব '+(e.run>0?'পাওনা ':e.run<0?'দেনা ':'')+bn(e.run)+'</div></div><b class="'+(e.kind==="D"?'exp':'inc')+'">'+(e.kind==="D"?"+":"−")+bn(e.amt)+'</b><button class="del" data-de="'+e.id+'" aria-label="মুছুন">×</button></div>'}).join(""):'<div class="empty">কোনো লেনদেন নেই</div>')+'</div>'+
  '<button class="ghost" id="imgP" style="width:100%;margin-bottom:10px">হিসাব ছবি হিসেবে সংরক্ষণ ও শেয়ার করুন</button>'+'<button class="ghost" id="shareP" style="width:100%;margin-bottom:10px">এই ব্যক্তির হিসাব শেয়ার করুন</button>'+'<button class="ghost" id="delP" style="color:var(--exp)">'+(armed?'নিশ্চিত? আবার চাপুন':'এই ব্যক্তিকে মুছুন')+'</button>';
}

var EKEY="khata_email",BKEY="khata_lastbackup",rArmed=false;
function getEmail(){try{return localStorage.getItem(EKEY)||""}catch(e){return ""}}
function setEmail(v){try{localStorage.setItem(EKEY,v)}catch(e){}}
function lastB(){try{return localStorage.getItem(BKEY)||""}catch(e){return ""}}
function markB(){try{localStorage.setItem(BKEY,new Date().toLocaleString("bn-BD"))}catch(e){}var l=document.getElementById("lb");if(l)l.textContent="শেষ ব্যাকআপ: "+lastB()}
function setMsg(s){var m=document.getElementById("msg");if(m)m.textContent=s}
function sortE(p){return p.entries.slice().sort(function(a,b){return a.date===b.date?a.id-b.id:a.date.localeCompare(b.date)})}
function summary(p){var b=bal(p);
  return p.name+(p.phone?" ("+p.phone+")":"")+" – "+(b>0?"পাওনা ":b<0?"দেনা ":"হিসাব সমান")+(b?bn(b):"")+"\n"+sortE(p).map(function(e){return e.date+" "+(e.kind==="D"?"প্রদান +":"প্রাপ্তি −")+bn(e.amt)+(e.note?" ("+e.note+")":"")}).join("\n")+"\n"}
function backupText(){var rec=0,ow=0;people.forEach(function(p){var b=bal(p);if(b>0)rec+=b;else ow-=b});
  return "দেনা-পাওনার খাতা – ব্যাকআপ ("+today()+")\nমোট পাওনা: "+bn(rec)+"\nমোট দেনা: "+bn(ow)+"\n\n"+people.map(summary).join("\n")+"\n---BACKUP---\n"+JSON.stringify(people.map(function(p){return {id:p.id,name:p.name,phone:p.phone||"",entries:p.entries}}))+"\n---END---"}
function copyText(txt,cb){
  function fb(){var ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();cb(ok)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){cb(true)},fb)}else fb()}
function shareText(txt,title,done){
  function cp(){copyText(txt,function(ok){done(ok?"copied":"fail")})}
  if(navigator.share){navigator.share({title:title,text:txt}).then(function(){done("ok")},function(err){if(err&&err.name==="AbortError")done("cancel");else cp()})}else cp()}
function backupCard(){
  return '<div class="card"><div class="lbl" style="margin-bottom:8px">ইমেইল ব্যাকআপ ও শেয়ার</div>'+
  '<input id="em" type="email" inputmode="email" placeholder="আপনার ইমেইল ঠিকানা" value="'+esc(getEmail())+'">'+
  '<div class="row" style="margin-top:8px"><button id="bkMail">ইমেইলে ব্যাকআপ পাঠান</button><button id="bkShare" class="get">শেয়ার করুন</button></div>'+
  '<button id="imgAll" class="ghost" style="width:100%;margin-top:8px">সকলের হিসাব ছবি হিসেবে দেখুন ও শেয়ার করুন</button>'+'<button id="bkCsv" class="ghost" style="width:100%;margin-top:8px">ড্রাইভের জন্য শিট (CSV) ফাইল সেভ/শেয়ার করুন</button>'+'<button id="bkTsv" class="ghost" style="width:100%;margin-top:8px">শিটে পেস্ট করার জন্য কপি করুন</button>'+'<button id="bkCopy" class="ghost" style="width:100%;margin-top:8px">ব্যাকআপ টেক্সট কপি করুন</button>'+
  '<div class="lbl" style="margin-top:8px" id="lb">শেষ ব্যাকআপ: '+(lastB()||"এখনো হয়নি")+'</div>'+
  '<div class="lbl" style="margin-top:12px">পুনরুদ্ধার: ইমেইলের ব্যাকআপ টেক্সট (পুরোটা) অথবা শিটের সব ঘর কপি করে নিচে পেস্ট করুন।</div>'+
  '<textarea id="bk" placeholder="ব্যাকআপ টেক্সট এখানে পেস্ট করুন"></textarea>'+
  '<button id="bkRestore" style="margin-top:8px">পুনরুদ্ধার করুন</button>'+
  '<div class="lbl" id="msg" style="margin-top:8px"></div></div>'}
document.getElementById("app").onchange=function(e){var t=e.target,id=t.id;
  if(id==="em")setEmail(t.value.trim());
  else if(id==="pf"&&t.files[0])readPhoto(t.files[0],function(d){newPhoto=d;var m=document.getElementById("pfm");if(m)m.textContent=d?"— বাছাই হয়েছে ✓":"— ছবি পড়া যায়নি"});
  else if(id==="ep"){var p=find(cur);if(p){p.phone=t.value.trim();save()}}
  else if(id==="epf"&&t.files[0])readPhoto(t.files[0],function(d){var p=find(cur);if(p&&d){p.photo=d;save();draw()}})};
var newPhoto="";
function readPhoto(f,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(im.width,im.height),c=document.createElement("canvas");c.width=c.height=160;c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160);cb(c.toDataURL("image/jpeg",0.7))};im.onerror=function(){cb("")};im.src=r.result};r.onerror=function(){cb("")};r.readAsDataURL(f)}
function av(p,sz){var st="width:"+sz+"px;height:"+sz+"px;border-radius:50%;flex:none;";
  return p.photo?'<img src="'+p.photo+'" alt="" style="'+st+'object-fit:cover">':'<div style="'+st+'background:var(--bd);color:var(--mut);display:flex;align-items:center;justify-content:center;font-weight:700">'+esc((p.name||"?").charAt(0))+'</div>'}
function csvRows(tsv){var rows=[["নাম","ফোন","তারিখ","ধরন","পরিমাণ","বিবরণ","চলতি হিসাব"]];
  people.forEach(function(p){var ph=p.phone?(tsv?"'"+p.phone:p.phone):"",run=0,es=sortE(p);
    if(!es.length){rows.push([p.name,ph,"","","","",0]);return}
    es.forEach(function(e){run+=e.kind==="D"?e.amt:-e.amt;rows.push([p.name,ph,e.date,e.kind==="D"?"প্রদান":"প্রাপ্তি",e.amt,e.note||"",run])})});return rows}
function toSheet(rows,sep){function c(v){v=String(v);return /[",\t\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}return rows.map(function(r){return r.map(c).join(sep)}).join("\n")}
function parseTable(s){var sep=s.indexOf("\t")>=0?"\t":",",rows=[],row=[],c="",q=false;
  for(var i=0;i<s.length;i++){var ch=s[i];
    if(q){if(ch==='"'){if(s[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===sep){row.push(c);c=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&s[i+1]==="\n")i++;row.push(c);c="";rows.push(row);row=[]}
    else c+=ch}
  row.push(c);rows.push(row);return rows}
function parseSheet(s){s=s.replace(/^\uFEFF/,"").trim();var rows=parseTable(s);
  if(rows.length<2)return null;var h=rows[0].map(function(x){return x.trim()});
  if(h.indexOf("নাম")<0||h.indexOf("পরিমাণ")<0)return null;
  var map={},out=[],u=Date.now();
  rows.slice(1).forEach(function(r){var nm=(r[0]||"").trim();if(!nm)return;var ph=(r[1]||"").trim().replace(/^'/,""),key=nm+"|"+ph,p=map[key];
    if(!p){p={id:u++,name:nm,phone:ph,entries:[]};map[key]=p;out.push(p)}
    var amt=parseFloat(r[4]);if(!(amt>0)||!r[2])return;
    p.entries.push({id:u++,date:r[2].trim(),note:(r[5]||"").trim(),kind:(r[3]||"").trim()==="প্রদান"?"D":"P",amt:amt})});
  return out.length?out:null}
var curCv=null,FF='"Noto Sans Bengali","Hind Siliguri",Arial,sans-serif';
function fit(x,s,w){if(x.measureText(s).width<=w)return s;while(s.length>1&&x.measureText(s+"…").width>w)s=s.slice(0,-1);return s+"…"}
function personSpec(p){var b=bal(p),run=0;
  var rows=sortE(p).map(function(e){run+=e.kind==="D"?e.amt:-e.amt;
    return {a:e.note||(e.kind==="D"?"প্রদান":"প্রাপ্তি"),b:e.date+" · হিসাব "+(run>0?"পাওনা ":run<0?"দেনা ":"")+bn(run),c:(e.kind==="D"?"+":"−")+bn(e.amt),col:e.kind==="D"?"#c0392b":"#1a7f4b"}}).reverse();
  return {title:p.name,sub:"দেনা-পাওনার হিসাব · "+today()+(p.phone?" · "+p.phone:""),label:b>0?"আপনার পাওনা":b<0?"আপনার দেনা":"হিসাব সমান",big:bn(b),bigCol:b>0?"#1a7f4b":b<0?"#c0392b":"#6b7785",rows:rows}}
function allSpec(){var rec=0,ow=0;people.forEach(function(p){var b=bal(p);if(b>0)rec+=b;else ow-=b});
  var rows=people.slice().sort(function(a,b){return Math.abs(bal(b))-Math.abs(bal(a))}).map(function(p){var b=bal(p);
    return {a:p.name,b:p.entries.length+"টি লেনদেন · "+(b>0?"পাওনা আছে":b<0?"দেনা আছে":"হিসাব সমান"),c:bn(b),col:b>0?"#1a7f4b":b<0?"#c0392b":"#6b7785"}});
  return {title:"সকলের হিসাব",sub:"দেনা-পাওনার খাতা · "+today(),pair:[{l:"মোট পাওনা",v:bn(rec),col:"#1a7f4b"},{l:"মোট দেনা",v:bn(ow),col:"#c0392b"}],rows:rows}}
function drawSpec(o){
  var W=800,sc=2,n=o.rows.length,H=250+Math.max(n,1)*64+70;
  var cv=document.createElement("canvas");cv.width=W*sc;cv.height=H*sc;var x=cv.getContext("2d");x.scale(sc,sc);
  x.fillStyle="#fff";x.fillRect(0,0,W,H);
  x.fillStyle="#1f4e78";x.fillRect(0,0,W,96);
  x.fillStyle="#fff";x.textAlign="left";
  x.font="700 30px "+FF;x.fillText(fit(x,o.title,W-60),30,46);
  x.font="400 16px "+FF;x.fillText(o.sub,30,76);
  x.fillStyle="#f5f7fa";x.fillRect(30,120,W-60,100);
  x.textAlign="center";
  var pr=o.pair||[{l:o.label,v:o.big,col:o.bigCol}];
  pr.forEach(function(q,i){var cx=pr.length===1?W/2:(i?W*0.75:W*0.25);
    x.fillStyle="#6b7785";x.font="400 17px "+FF;x.fillText(q.l,cx,150);
    x.fillStyle=q.col;x.font="700 40px "+FF;x.fillText(q.v,cx,200)});
  var y=250;
  if(!n){x.fillStyle="#6b7785";x.font="400 18px "+FF;x.fillText("কোনো লেনদেন নেই",W/2,y+36)}
  o.rows.forEach(function(r){
    x.strokeStyle="#d9e0e8";x.beginPath();x.moveTo(30,y+64);x.lineTo(W-30,y+64);x.stroke();
    x.textAlign="left";x.fillStyle="#1b2430";x.font="600 20px "+FF;x.fillText(fit(x,r.a,W-290),30,y+28);
